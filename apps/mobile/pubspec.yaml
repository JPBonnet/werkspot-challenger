name: werkspot_challenger
description: Werkspot Challenger — Dutch handymen marketplace (customer + pro apps).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Data + auth
  supabase_flutter: ^2.8.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.6.1

  # Payments
  flutter_stripe: ^11.1.0

  # Push + local
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Media + location
  image_picker: ^1.1.2
  record: ^5.1.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  mapbox_maps_flutter: ^2.5.0

  # Utilities
  intl: ^0.19.0
  http: ^1.2.2
  collection: ^1.18.0

  # Observability
  sentry_flutter: ^8.9.0
  posthog_flutter: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.8
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  generate: true
